name: Deploy to Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Manual deployment via GitHub Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  VITE_GOOGLE_ANALYTICS_ID: ${{ secrets.VITE_GOOGLE_ANALYTICS_ID }}
  VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm ci
        npm install --legacy-peer-deps
        
    - name: Run TypeScript check
      run: npx tsc --noEmit
      
    - name: Build for production
      run: npm run build
      
    - name: Check bundle size
      run: |
        echo "Bundle analysis:"
        ls -la dist/assets/
        du -sh dist/
        echo "Checking for optimal bundle sizes..."
        
        # Check if main bundle is under reasonable size
        MAIN_SIZE=$(find dist/assets -name "*.js" -exec du -k {} + | sort -n | tail -1 | cut -f1)
        echo "Largest JS bundle: ${MAIN_SIZE}KB"
        
        if [ "$MAIN_SIZE" -gt 500 ]; then
          echo "Warning: Large bundle detected (${MAIN_SIZE}KB > 500KB)"
        fi
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-files
        path: dist/
        retention-days: 7

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: npm audit --audit-level=moderate
      continue-on-error: true
      
    - name: Check for vulnerabilities
      run: npx audit-ci --moderate
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm ci
          npm install --legacy-peer-deps
          
      - name: Build for production
        run: npm run build
        env:
          NODE_ENV: production
          
      - name: Validate build output
        run: |
          echo "Validating build output..."
          
          # Check if essential files exist
          test -f dist/index.html || { echo "index.html missing!"; exit 1; }
          test -f dist/sitemap.xml || { echo "sitemap.xml missing!"; exit 1; }
          test -f dist/robots.txt || { echo "robots.txt missing!"; exit 1; }
          test -f dist/manifest.json || { echo "manifest.json missing!"; exit 1; }
          test -f dist/sw.js || { echo "service worker missing!"; exit 1; }
          
          echo "All essential files present ✓"
          
          # Check bundle structure
          echo "Bundle structure:"
          find dist/assets -name "*.js" | head -10
          find dist/assets -name "*.css" | head -5
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  performance-monitoring:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Wait for deployment
      run: sleep 30
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        
    - name: Check site availability
      run: |
        echo "Checking site availability..."
        SITE_URL="${{ steps.deployment.outputs.page_url }}"
        curl -f "$SITE_URL" || exit 1
        echo "Site is accessible ✓"
        
    - name: Performance check with Lighthouse
      run: |
        # Install Lighthouse
        npm install -g lighthouse
        
        echo "Running Lighthouse performance audit..."
        SITE_URL="${{ steps.deployment.outputs.page_url }}"
        
        lighthouse "$SITE_URL" \
          --output json \
          --output-path ./lighthouse-report.json \
          --chrome-flags="--headless --no-sandbox --disable-gpu" \
          --quiet
          
        # Extract scores
        PERFORMANCE_SCORE=$(node -p "Math.round(JSON.parse(require('fs').readFileSync('./lighthouse-report.json')).categories.performance.score * 100)")
        ACCESSIBILITY_SCORE=$(node -p "Math.round(JSON.parse(require('fs').readFileSync('./lighthouse-report.json')).categories.accessibility.score * 100)")
        SEO_SCORE=$(node -p "Math.round(JSON.parse(require('fs').readFileSync('./lighthouse-report.json')).categories.seo.score * 100)")
        BEST_PRACTICES_SCORE=$(node -p "Math.round(JSON.parse(require('fs').readFileSync('./lighthouse-report.json')).categories['best-practices'].score * 100)")
        
        echo "🚀 Lighthouse Scores:"
        echo "Performance: $PERFORMANCE_SCORE/100"
        echo "Accessibility: $ACCESSIBILITY_SCORE/100"
        echo "SEO: $SEO_SCORE/100"
        echo "Best Practices: $BEST_PRACTICES_SCORE/100"
        
        # Set minimum thresholds
        MIN_PERFORMANCE=85
        MIN_ACCESSIBILITY=95
        MIN_SEO=95
        MIN_BEST_PRACTICES=90
        
        FAILED=false
        
        if [ "$PERFORMANCE_SCORE" -lt "$MIN_PERFORMANCE" ]; then
          echo "❌ Performance score $PERFORMANCE_SCORE is below threshold of $MIN_PERFORMANCE"
          FAILED=true
        fi
        
        if [ "$ACCESSIBILITY_SCORE" -lt "$MIN_ACCESSIBILITY" ]; then
          echo "❌ Accessibility score $ACCESSIBILITY_SCORE is below threshold of $MIN_ACCESSIBILITY"
          FAILED=true
        fi
        
        if [ "$SEO_SCORE" -lt "$MIN_SEO" ]; then
          echo "❌ SEO score $SEO_SCORE is below threshold of $MIN_SEO"
          FAILED=true
        fi
        
        if [ "$BEST_PRACTICES_SCORE" -lt "$MIN_BEST_PRACTICES" ]; then
          echo "❌ Best Practices score $BEST_PRACTICES_SCORE is below threshold of $MIN_BEST_PRACTICES"
          FAILED=true
        fi
        
        if [ "$FAILED" = "true" ]; then
          echo "🔥 Performance check failed!"
          exit 1
        else
          echo "✅ All performance checks passed!"
        fi
